plugins {
    id "com.android.application"
}

android {
    namespace "com.cfdatapro.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.cfdatapro.app"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName System.getenv("ANDROID_VERSION_NAME") ?: "1.0"
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}
