name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: false
        default: "v1.0"
        type: string
      prerelease:
        description: "Mark release as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  check:
    name: Format & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: gofmt check
        run: |
          bad=$(gofmt -l . | grep -v '^$' || true)
          if [ -n "$bad" ]; then
            echo "未格式化的文件:"
            echo "$bad"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

  build:
    name: Build
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: windows
            goarch: arm64
            ext: ".exe"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Set version
        id: set-version
        run: |
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ]; then
            version="${{ github.ref_name }}"
          fi
          if [ -z "$version" ] || [ "$version" = "main" ]; then
            version="dev-$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$version" >> $GITHUB_OUTPUT
          # versionCode：v1.5 -> 115，保证发版递增
          code=$(echo "$version" | sed -E 's/^v([0-9]+)\.([0-9]+).*/\1\2/;s/[^0-9]//g')
          if [ -z "$code" ]; then code=1; fi
          echo "VERSION_CODE=$((code + 100))" >> $GITHUB_OUTPUT

      - name: Build
        run: |
          ext="${{ matrix.ext || '' }}"
          filename="cfdata-pro-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          echo "Building ${filename}..."
          mkdir -p release_assets
          go build -trimpath -ldflags "-s -w -X main.appVersion=${{ steps.set-version.outputs.VERSION }}" -o release_assets/${filename} .
        env:
          GOARCH: ${{ matrix.goarch }}
          GOOS: ${{ matrix.goos }}
          CGO_ENABLED: "0"

      - name: Generate SHA256
        run: |
          cd release_assets
          for file in $(find . -type f ! -name '*.sha256'); do
            sha256sum "$file" | awk '{print $1}' > "${file}.sha256"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext || '' }}
          path: release_assets/*

  android-apk:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      # 注意：ubuntu-latest runner 已预装 Android SDK（ANDROID_HOME），
      # 不需要 android-actions/setup-android（该 action 在新版 runner 上会失败）
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Set version
        id: set-version
        run: |
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ]; then
            version="${{ github.ref_name }}"
          fi
          if [ -z "$version" ] || [ "$version" = "main" ]; then
            version="dev-$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$version" >> $GITHUB_OUTPUT
          # versionCode：v1.5 -> 115，保证发版递增
          code=$(echo "$version" | sed -E 's/^v([0-9]+)\.([0-9]+).*/\1\2/;s/[^0-9]//g')
          if [ -z "$code" ]; then code=1; fi
          echo "VERSION_CODE=$((code + 100))" >> $GITHUB_OUTPUT

      - name: Build Android backend
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags "-s -w -X main.appVersion=${{ steps.set-version.outputs.VERSION }}" -o app/src/main/jniLibs/arm64-v8a/libcfdatapro.so .

      # 固定签名：从 Secrets 还原 keystore，保证每次构建签名一致，
      # 否则 Android 会因签名不同拒绝覆盖安装
      - name: Restore signing keystore
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
        run: |
          echo "$APK_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "APK_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ANDROID_VERSION_NAME: ${{ steps.set-version.outputs.VERSION }}
          ANDROID_VERSION_CODE: ${{ steps.set-version.outputs.VERSION_CODE }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify APK contains backend
        run: |
          unzip -l app/build/outputs/apk/release/app-release.apk | tee apk-contents.txt
          grep -q "lib/arm64-v8a/libcfdatapro.so" apk-contents.txt

      - name: Prepare APK asset
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/release/app-release.apk release_assets/cfdata-pro-android-arm64.apk
          cd release_assets
          sha256sum cfdata-pro-android-arm64.apk | awk '{print $1}' > cfdata-pro-android-arm64.apk.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-android-arm64-apk
          path: release_assets/*

  release:
    name: Release
    needs: [build, android-apk]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: asset-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "CFData-Pro ${{ github.ref_name }}"
          body: |
            ## CFData-Pro ${{ github.ref_name }}

            Cloudflare IP 优选工具：CFData-WEB 平台 + guanfang-youxuan 带宽优选引擎。

            - ☁️ 官方优选 / 📂 非标优选 / ⚡ 增强优选（带宽优选）
            - 支持 Linux / macOS / Windows（amd64、arm64）
            - Android APK（arm64，点开即用，内置本地服务）

            构建方式：GitHub Actions 自动构建。
          files: artifacts/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
